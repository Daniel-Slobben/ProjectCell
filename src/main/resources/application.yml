logging.level.slobben: INFO
spring:
  application:
    name: Cells
  threads:
    virtual:
      enabled: true

cells:
  setup: EMPTY

  random:
    blockPopulation: '1'
    cellPopulation: '2'

  pruning-per-generation: '100'

  size:
    x: '0'
    y: '0'
    blockSize: '500'
    bigBlockCombineFactor: '4' # 16 pixels are 1

  runmode: AUTO
  targetspeed: '1000'

  recording:
    max-recording-depth: 4
