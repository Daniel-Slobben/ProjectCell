logging.level.slobben: INFO
spring:
  application:
    name: Cells
  threads:
    virtual:
      enabled: true
  # the jar runs as pro unless told otherwise, mvn spring-boot:run activates local (see pom.xml)
  profiles:
    default: pro

cells:
  pruning-per-generation: '100'

  size:
    x: '0'
    y: '0'
    blockSize: '2000'
    sectorSize: '50'

  runmode: AUTO

  recording:
    max-recording-depth: 4
