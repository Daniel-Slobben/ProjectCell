logging.level.slobben: INFO
spring:
  application:
    name: Cells
  threads:
    virtual:
      enabled: true

cells:
  pruning-per-generation: '100'

  chaos:
    type: ANY
    max-blocks: 4000
    max-pixels: 1_000_000_000

  size:
    x: '0'
    y: '0'
    blockSize: '2000'
    sectorSize: '50'

  runmode: AUTO
  targetspeed: '500'
  # the frontend switches to sectors at 250 blocks in view, about 320 with the ring around it
  max-cell-blocks: 500
  # what a client's block budget refills by; see ClientService.overBudget
  client-blocks-per-second: 100
  # browsers only; the load test sends no Origin
  allowed-origins: https://world-of-cells.net, https://www.world-of-cells.net

  sectors:
    period-ms: 10000
    tile: 16

  recording:
    max-recording-depth: 4
