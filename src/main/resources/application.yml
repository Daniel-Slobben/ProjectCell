# production, the jar runs with these under any profile. mvn spring-boot:run adds application-local.yml (see pom.xml)
logging.level.slobben: INFO
spring:
  application:
    name: Cells
  threads:
    virtual:
      enabled: true

cells:
  pruning-per-generation: '100'

  chaos:
    type: ANY
    max-blocks: 500
    # leaves the other half of each tick for clients fetching blocks
    max-cycle-share: 0.5

  size:
    x: '0'
    y: '0'
    blockSize: '2000'
    sectorSize: '50'

  runmode: AUTO
  targetspeed: '250'

  recording:
    max-recording-depth: 4
