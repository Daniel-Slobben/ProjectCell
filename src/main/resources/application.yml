logging.level.slobben: INFO
spring:
  application:
    name: Cells
  threads:
    virtual:
      enabled: true

cells:
  pruning-per-generation: '100'
  chaos:
    max-blocks: 1500
  cycle:
    type: ANY
  size:
    x: '0'
    y: '0'
    blockSize: '2000'
    sectorSize: '50'

  runmode: AUTO
  targetspeed: '250'
  max-cell-blocks: 600
  client-blocks-per-second: 100
  allowed-origins: https://world-of-cells.net, https://www.world-of-cells.net, https://dewereldvancellen.nl, https://www.dewereldvancellen.nl

  sectors:
    period-ms: 10000
    blocks-per-tick: 250